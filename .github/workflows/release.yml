name: Build & Release Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure or auto-generate release keystore
        shell: bash
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          PROPS_FILE="${GITHUB_WORKSPACE}/.github/keystore.properties"

          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "Using release keystore from GitHub Secrets."
            echo "$SECRET_KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
            STORE_PASS="$SECRET_STORE_PASSWORD"
            KEY_PASS="$SECRET_KEY_PASSWORD"
          elif [ -f "$KEYSTORE_FILE" ] && [ -f "$PROPS_FILE" ]; then
            echo "Using existing repository release keystore."
            # shellcheck disable=SC1090
            source "$PROPS_FILE"
            STORE_PASS="$STORE_PASSWORD"
            KEY_PASS="$KEY_PASSWORD"
          else
            echo "First run detected: generating release keystore and committing to repository."
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -dname "CN=Ludo Play, OU=Mobile, O=LudoPlay, L=Unknown, ST=Unknown, C=IN"

            mkdir -p "$(dirname "$PROPS_FILE")"
            printf 'STORE_PASSWORD=%s\nKEY_PASSWORD=%s\n' "$PASS" "$PASS" > "$PROPS_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE_FILE" "$PROPS_FILE"
            git commit -m "chore: generate release signing keystore [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"

            STORE_PASS="$PASS"
            KEY_PASS="$PASS"
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Compute incrementing app version
        shell: bash
        run: |
          VERSION_CODE=$(( GITHUB_RUN_NUMBER + 1 ))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi
          cp app/build/outputs/apk/release/app-release.apk "Ludo-Play-v${VERSION_NAME}.apk"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          APK_FILE="Ludo-Play-v${VERSION_NAME}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" \
              --title "Ludo Play ${TAG} (Build ${VERSION_CODE})" \
              --notes "Automated signed release APK for commit \`${GITHUB_SHA::7}\` on branch \`${GITHUB_REF_NAME}\`. Installs cleanly over previous releases." \
              --latest
          fi
